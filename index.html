function resize() {

function genSpec(level, P) {

      for (let a = 0; a < sizes[l]; a++) for (let b = 0; b < sizes[l + 1]; b++) if (l === 0 || R() < 0.7) pairs.push([a, b]);
      for (let a = 0; a < sizes[l]; a++) if (!pairs.some(p => p[0] === a)) pairs.push([a, R() * sizes[l + 1] | 0]);
      for (let b = 0; b < sizes[l + 1]; b++) if (!pairs.some(p => p[1] === b)) { const a = R() * sizes[l] | 0; if (!has(a, b)) pairs.push([a, b]); }

      labels = prob.bad.slice().sort(() => R() - 0.5); labels.splice(t, 0, prob.ok);

    for (let gx = 0; gx < 8; gx++) for (let gy = 0; gy < 3; gy++) ctx.fillText('?', sx + (gx + 0.5) * sw / 8, hy + (gy + 0.5) * (sy + sh - hy) / 3 + Math.sin(t * 2 + gx + gy) * 2);
    ctx.textBaseline = 'alphabetic';
    ctx.strokeStyle = rgba(col, 0.9); ctx.lineWidth = 2; ctx.setLineDash([7, 6]); ctx.lineDashOffset = -t * 20; ctx.beginPath(); ctx.moveTo(sx, hy); ctx.lineTo(sx + sw, hy); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
  roundRect(sx, sy, sw, sh, big ? 14 : 8); ctx.lineWidth = 1.5; ctx.strokeStyle = rgba(col, 0.55); ctx.stroke();
  // título, separador y dato
  ctx.textAlign = 'center';
  ctx.save(); if (big) glowOn(rgba(col, 0.9), 14); ctx.fillStyle = '#fff'; ctx.font = `700 ${big ? 28 : 14}px ${F}`;
  const ny = wrap(half ? '? ? ?' : c.name, cx, sy + sh + (big ? 44 : 20), w - 2 * pad, big ? 32 : 17); ctx.restore();
  if (big) {
    const dy = ny + 20; ctx.strokeStyle = rgba(col, 0.6); ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(x + w * 0.22, dy); ctx.lineTo(cx - 10, dy); ctx.moveTo(cx + 10, dy); ctx.lineTo(x + w * 0.78, dy); ctx.stroke();
    ctx.save(); ctx.translate(cx, dy); ctx.rotate(Math.PI / 4); ctx.fillStyle = rgba(col, 1); ctx.fillRect(-4, -4, 8, 8); ctx.restore();
    ctx.fillStyle = half ? rgba(col, 0.9) : '#cfdbe8'; ctx.font = `18px ${F}`;
    wrap(half ? 'Pasá el próximo nivel para completarla y descubrir qué es.' : c.fact, cx, dy + 34, w - 2 * pad - 10, 25);
  }
  // brillo que barre la figurita y destellos
  ctx.save(); roundRect(x, y, w, h, rad); ctx.clip();
  const sw2 = ((t * 0.4) % 2.4 - 0.7) * (w + h);
  ctx.translate(x + sw2, y); ctx.rotate(0.45); ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(-35, -h, 70, h * 3); ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(48, -h, 18, h * 3);
  ctx.restore();
  for (let s = 0; s < (big ? 8 : 3); s++) { const tw = Math.sin(t * 2.6 + s * 1.9 + i); if (tw > 0.55) sparkle(x + 10 + hr(s * 3 + i) * (w - 20), y + 10 + hr(s * 5 + i + 1) * (h - 20), (tw - 0.55) * (big ? 24 : 12)); }
  ctx.restore();
}
function drawBurst(cx, cy, t) {
  if (t < 0 || t > 1.2) return;
  for (let i = 0; i < 40; i++) { const a = i * 2.4 + hr(i), r = 40 + t * (260 + 160 * hr(i + 9)); dot(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 3 + 3 * hr(i + 4), (i % 3 === 0 ? 'rgba(255,216,74,' : i % 2 ? CYc : MGc) + Math.max(0, 1 - t / 1.2).toFixed(2) + ')'); }
}
function drawAlbum() {
  drawBackground();
  ctx.textAlign = 'center'; ctx.fillStyle = TH.accent; ctx.font = `700 40px ${F}`; ctx.fillText('Álbum cuántico', W / 2, 78);
  ctx.fillStyle = TH.sub; ctx.font = `19px ${F}`; ctx.fillText(L(`${albumDone()} de ${CARDS.length} completas · cada nivel te da media figurita`, `${albumDone()} of ${CARDS.length} complete · every level gives half a card`), W / 2, 114);
  CH.forEach((ch, c) => ch.cards.forEach((id, k) => {
    const cx = 40 + k * 220, cy = 140 + c * 200, parts = save.cards[id] || 0;
    if (parts) { drawCard(id, cx, cy, 200, 188, T + id, null, 1, parts < 2); BTN['card' + id] = [cx, cy, 200, 188]; }
    else {
      roundRect(cx, cy, 200, 188, 14); ctx.fillStyle = TH.dark ? 'rgba(255,255,255,0.04)' : '#fff'; ctx.fill();
      ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.strokeStyle = rgba(ch.col, 0.35); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = rgba(ch.col, 0.5); ctx.font = `700 54px ${F}`; ctx.fillText('?', cx + 100, cy + 104);
      ctx.fillStyle = TH.faint; ctx.font = `14px ${F}`; ctx.fillText(`${ch.icon} ${tr(ch.name)}`, cx + 100, cy + 160);
      BTN['card' + id] = null;
    }
  }));
  button('back', W / 2 - 130, 1160, 260, 60, '◀  Volver', TH.accent);
}
function drawCardView() {
  drawBackground(); ctx.fillStyle = 'rgba(2,5,10,0.55)'; ctx.fillRect(0, 0, W, H);
  drawCard(cardView, 90, 230, 540, 610, T, null, 1, (save.cards[cardView] || 0) < 2);
  button('back', W / 2 - 130, 900, 260, 62, '◀  Álbum', TH.accent);
}
function drawChapters() {
  drawBackground();
  ctx.textAlign = 'center'; ctx.fillStyle = TH.accent; ctx.font = `700 40px ${F}`; ctx.fillText('Capítulos', W / 2, 74);
  ctx.fillStyle = TH.gold; ctx.font = `700 20px ${F}`; ctx.fillText(`★ ${totalStars()} ${L('de', 'of')} ${LAST * 3}`, W / 2, 108);
  CH.forEach((ch, c) => {
    const x = 30, y = 136 + c * 198, w = W - 60, h = 182, open = chapOpen(c);
    ctx.save(); if (open && TH.dark) glowOn(rgba(ch.col, 0.25), 18);
    roundRect(x, y, w, h, 18); ctx.fillStyle = TH.card; ctx.fill(); ctx.restore();
    roundRect(x, y, w, h, 18); ctx.lineWidth = 2; ctx.strokeStyle = rgba(ch.col, open ? 0.75 : 0.2); ctx.stroke();
    ctx.globalAlpha = open ? 1 : 0.42;
    ctx.textAlign = 'center'; ctx.font = `44px ${F}`; ctx.textBaseline = 'middle'; ctx.fillText(ch.icon, x + 50, y + 52); ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left'; ctx.fillStyle = TH.text; ctx.font = `700 26px ${F}`; ctx.fillText(`${c + 1}. ${tr(ch.name)}`, x + 92, y + 46);
    ctx.fillStyle = TH.sub; ctx.font = `17px ${F}`; ctx.fillText(ch.desc, x + 92, y + 74);
    ctx.textAlign = 'right'; ctx.fillStyle = TH.gold; ctx.font = `700 19px ${F}`; ctx.fillText(`★ ${chapStars(c)}/${PER * 3}`, x + w - 22, y + 46);
    for (let j = 0; j < PER; j++) {
      const n = c * PER + j + 1, px = x + 92 + j * 90, py = y + 124, st = save.stars[n] || 0, can = levelOpen(n);
      ctx.beginPath(); ctx.arc(px, py, 24, 0, 7);
      if (st) { ctx.fillStyle = rgba(ch.col, 0.9); ctx.fill(); }
      else { ctx.fillStyle = TH.dark ? 'rgba(255,255,255,0.03)' : '#fff'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = can ? rgba(ch.col, 0.9) : TH.track; ctx.stroke(); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `700 19px ${F}`;
      ctx.fillStyle = st ? '#05080f' : can ? rgba(ch.col, 1) : TH.faint; ctx.fillText(can || st ? j + 1 : '🔒', px, py + 1); ctx.textBaseline = 'alphabetic';
      if (can && !st && Math.sin(T * 4) > 0) { ctx.beginPath(); ctx.arc(px, py, 30, 0, 7); ctx.lineWidth = 2; ctx.strokeStyle = rgba(ch.col, 0.5); ctx.stroke(); }
      ctx.fillStyle = TH.gold; ctx.font = `13px ${F}`; ctx.fillText('★'.repeat(st), px, py + 44);
      BTN['lv' + n] = can ? [px - 30, py - 30, 60, 60] : null;
    }
    ctx.globalAlpha = 1;
    if (!open) { ctx.textAlign = 'right'; ctx.fillStyle = TH.warn; ctx.font = `700 17px ${F}`; ctx.fillText(L(`🔒 Necesitás ${ch.need} ★`, `🔒 Needs ${ch.need} ★`), x + w - 22, y + 74); }
  });
  button('back', W / 2 - 130, 1140, 260, 60, '◀  Volver', TH.accent);
  if (toast && toast.t < 5) {
    const a = Math.min(1, toast.t * 4, (5 - toast.t) * 2);
    ctx.globalAlpha = a; ctx.font = `700 19px ${F}`;
    roundRect(30, 1206, W - 60, 66, 20); ctx.fillStyle = TH.panel; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = TH.gold; ctx.stroke();
    ctx.fillStyle = TH.text; ctx.textAlign = 'center'; ctx.font = `700 17px ${F}`; wrap(toast.text, W / 2, 1232, W - 110, 22); ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = TH.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (state === 'title') { drawTitle(); ctx.restore(); return; }
  if (state === 'science') { drawScience(); ctx.restore(); return; }
  if (state === 'album') { drawAlbum(); ctx.restore(); return; }
  if (state === 'chapters') { drawChapters(); ctx.restore(); return; }
  if (state === 'attract') { drawAttract(); ctx.restore(); return; }
  if (state === 'initials') { drawInitials(); ctx.restore(); return; }
  if (state === 'board') { drawBoard(); ctx.restore(); return; }
  if (state === 'card') { drawCardView(); ctx.restore(); return; }
  drawBackground(); drawNet(); drawHud(); drawPreview(); drawHand();
  for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col || TH.sub; ctx.font = `700 ${p.size}px ${F}`; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y - 40 * p.t); ctx.globalAlpha = 1; }
  drawOverlay();
  ctx.restore();
}

function update(dt) {
  T += dt; stT += dt; if (toast) toast.t += dt; shakeT = Math.max(0, shakeT - dt); flashT = Math.max(0, flashT - dt);
  popups.forEach(p => p.t += dt); popups = popups.filter(p => p.t < p.life);
  idleT += dt;
  if (state === 'title' && idleT > 20) startAttract();
  if (state === 'board' && idleT > 40) startAttract();
  if (state === 'attract') attractStep(dt);
  if (mode === 'arcade' && (state === 'play' || state === 'measure')) { arc.time -= dt; if (arc.time <= 0) { arc.time = 0; arcadeOver(); } }
  if (mode === 'arcade' && state === 'measure' && stT > 0.5) arcadeSolved();
  if (mode === 'story' && state === 'measure' && stT > 0.9) {
    state = 'won'; stT = 0;
    gotStars = used <= lv.par ? 3 : used <= lv.par + 1 ? 2 : 1;
    save.stars[level] = Math.max(save.stars[level] || 0, gotStars);
    if (level + 1 > save.max) save.max = level + 1;
    const id = CH[chapOf(level)].cards[jOf(level) >> 1], want = (jOf(level) & 1) ? 2 : 1, before = save.cards[id] || 0;
    if (want > before) save.cards[id] = want;
    cardIdx = id; cardHalf = (save.cards[id] || 0) < 2;
    rewardBadge = want > before ? (want === 1 ? 'NUEVA · 1/2' : before === 1 ? '¡COMPLETA!' : '¡NUEVA!') : null;
    persist(); sfx('reveal');
  }
}

let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(frame); }

// #lv=N abre un nivel; #lv=N&solve=1 lo muestra resuelto (para capturas)
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.get('lv')) {
  startLevel(+hp.get('lv'));
  if (hp.get('solve')) {
    const w = lv.wins.reduce((b, m) => pc(m ^ lv.start) < pc(b ^ lv.start) ? m : b, lv.wins[0]);
    lv.tog.forEach((k, j) => on[k] = (w >> j) & 1); used = pc(w ^ lv.start); moves -= used; res = evalLv(lv, on, true);
    if (hp.get('solve') === '2') { outcome = res.P.indexOf(Math.max(...res.P)); gotStars = 3; state = 'won'; stT = +(hp.get('t') || 3); cardIdx = CH[chapOf(level)].cards[jOf(level) >> 1]; cardHalf = hp.has('half'); rewardBadge = cardHalf ? 'NUEVA · 1/2' : '¡NUEVA!'; }
  }
}
if (hp.get('sel')) select(+hp.get('sel'));
if (hp.has('ciencia')) state = 'science';
if (hp.get('tema') && THEMES[hp.get('tema')]) { save.theme = hp.get('tema'); TH = THEMES[save.theme]; }
if (hp.has('portada')) state = 'title';
if (hp.get('fig')) { const n = +hp.get('fig'); for (let i = 0; i < CARDS.length; i++) save.cards[i] = i < n ? 2 : i === n ? 1 : 0; }
if (hp.get('stars')) { const n = +hp.get('stars'); for (let i = 1; i <= n; i++) save.stars[i] = i % 3 === 0 ? 2 : 3; }
if (hp.has('cap')) state = 'chapters';
if (hp.get('lang')) LANG = hp.get('lang');
if (hp.has('arcade')) startArcade();
if (hp.has('demo')) startAttract();
if (hp.has('board')) { save.board = [{ n: 'ROD', s: 4250, p: 12 }, { n: 'AMY', s: 3100, p: 9 }, { n: 'JKL', s: 1800, p: 6 }]; state = 'board'; }
if (hp.has('album')) state = 'album';
requestAnimationFrame(frame);
</script>
